name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, the end-to-end tests against the newest Herdr in nixos-unstable,
  # so changes in Herdr's API show up before users hit them.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: mods/ is built from src/
        run: npm run check-built
      - name: Type check (JSDoc, tsc --checkJs)
        run: npm run typecheck
      - name: Biome (lint and format)
        run: npx biome ci src scripts tests
      - name: ShellCheck
        run: shellcheck -x -e SC2016 -P SCRIPTDIR install.sh demo/herdr-demo demo/bin/* demo/state.sh
      - name: Tests (against the demo's fake Jira and GitHub)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          npm test

  # The real Herdr with the mods, on throwaway demos (npm run e2e), on Xvfb.
  # Herdr comes from the nixpkgs in flake.lock; the scheduled run uses the
  # newest nixos-unstable instead.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Use the newest nixpkgs (scheduled run)
        if: github.event_name == 'schedule'
        run: nix flake update nixpkgs
      - name: Herdr version
        run: nix develop .#e2e -c herdr-app --version
      - name: End-to-end tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          nix develop .#e2e -c npm run e2e
      # The mods at a few window sizes, sidebar widths, zooms, light and dark,
      # to look at (the weekly run: with the newest Herdr).
      - name: Screenshots at a few sizes
        run: nix develop .#e2e -c npm run e2e:shots
      - name: Keep the screenshots
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: e2e-results/shots/
          if-no-files-found: ignore
      - name: Screenshots and logs of the failed steps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results/
          if-no-files-found: ignore
